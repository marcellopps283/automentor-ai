[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automentor"
version = "0.1.0"
description = "Autonomous AI Study Companion & Portfolio Builder on Gemini & Google Cloud"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.1.0",
    "google-adk>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pygithub>=2.5.0",
    "google-api-python-client>=2.150.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "google-cloud-firestore>=2.19.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
]

[project.scripts]
automentor = "automentor.cli:start_cli"
